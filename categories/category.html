<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catégorie - Nos Produits</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <h1 id="categoryName">Catégorie</h1>
        <p>Découvrez nos marques et nos produits</p>
    </header>

    <main class="container">

        <div id="categoryContent">
            <p>Chargement...</p>
        </div>

        <a href="../index.html" class="back-button">
            ← Retour aux catégories
        </a>

    </main>

    <footer>
        <p>© 2026 - Nos Produits</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <script>
        async function loadCategory() {

            const params = new URLSearchParams(window.location.search);
            const categoryId = params.get("id");

            const categoryName =
                document.getElementById("categoryName");

            const categoryContent =
                document.getElementById("categoryContent");

            if (!categoryId) {
                categoryName.textContent = "Catégorie introuvable";
                categoryContent.innerHTML =
                    "<p>Aucune catégorie sélectionnée.</p>";
                return;
            }

            // Charger la catégorie
            const { data: category, error: categoryError } =
                await supabaseClient
                    .from("categories")
                    .select("id, name, image_url")
                    .eq("id", categoryId)
                    .eq("active", true)
                    .single();

            if (categoryError || !category) {
                console.error(categoryError);

                categoryName.textContent =
                    "Catégorie introuvable";

                categoryContent.innerHTML =
                    "<p>Impossible de charger cette catégorie.</p>";

                return;
            }

            categoryName.textContent = category.name;

            // Charger les marques
            const { data: brands, error: brandsError } =
                await supabaseClient
                    .from("brands")
                    .select("id, name, image_url, sort_order")
                    .eq("category_id", category.id)
                    .eq("active", true)
                    .order("sort_order", {
                        ascending: true
                    });

            if (brandsError) {
                console.error(brandsError);

                categoryContent.innerHTML =
                    "<p>Impossible de charger les marques.</p>";

                return;
            }

            if (!brands || brands.length === 0) {
                categoryContent.innerHTML =
                    "<p>Aucune marque disponible pour cette catégorie.</p>";

                return;
            }

            categoryContent.innerHTML = "";

            // Afficher les marques
            for (const brand of brands) {

                const brandSection =
                    document.createElement("section");

                brandSection.className = "brand-section";

                const brandTitle =
                    document.createElement("h2");

                brandTitle.textContent = brand.name;

                brandSection.appendChild(brandTitle);

                // Image de la marque
                if (brand.image_url) {

                    const brandImage =
                        document.createElement("img");

                    brandImage.src = brand.image_url;
                    brandImage.alt = brand.name;
                    brandImage.className = "brand-image";

                    brandSection.appendChild(brandImage);
                }

                // Charger les produits de la marque
                const { data: products, error: productsError } =
                    await supabaseClient
                        .from("products")
                        .select(
                            "id, name, image_url, colisage, sort_order"
                        )
                        .eq("brand_id", brand.id)
                        .eq("active", true)
                        .order("sort_order", {
                            ascending: true
                        });

                if (productsError) {
                    console.error(productsError);
                    continue;
                }

                if (!products || products.length === 0) {

                    const emptyMessage =
                        document.createElement("p");

                    emptyMessage.textContent =
                        "Aucun produit disponible.";

                    brandSection.appendChild(
                        emptyMessage
                    );

                } else {

                    const productsGrid =
                        document.createElement("div");

                    productsGrid.className = "products";

                    products.forEach(product => {

                        const productCard =
                            document.createElement("div");

                        productCard.className = "product";

                        // Image du produit
                        if (product.image_url) {

                            const productImage =
                                document.createElement("img");

                            productImage.src =
                                product.image_url;

                            productImage.alt =
                                product.name;

                            productCard.appendChild(
                                productImage
                            );
                        }

                        // Nom du produit
                        const productName =
                            document.createElement("h3");

                        productName.textContent =
                            product.name;

                        productCard.appendChild(
                            productName
                        );

                        // Colisage
                        if (product.colisage) {

                            const colisage =
                                document.createElement("p");

                            colisage.textContent =
                                "Colisage : " +
                                product.colisage;

                            productCard.appendChild(
                                colisage
                            );
                        }

                        productsGrid.appendChild(
                            productCard
                        );
                    });

                    brandSection.appendChild(
                        productsGrid
                    );
                }

                categoryContent.appendChild(
                    brandSection
                );
            }
        }

        loadCategory();
    </script>

</body>

</html>
