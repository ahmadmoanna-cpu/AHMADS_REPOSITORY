<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nos Produits</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Nos Produits</h1>
        <p>Découvrez notre sélection de produits</p>
    </header>

    <main class="container">

        <h2>Catégories</h2>

        <div class="categories" id="categories">
            <p>Chargement des catégories...</p>
        </div>

        <section class="welcome">

            <h2>Bienvenue</h2>

            <p>
                Sélectionnez une catégorie pour découvrir
                nos marques et nos produits.
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 - Nos Produits</p>
    </footer>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Connexion à Supabase -->
    <script src="supabase.js"></script>

    <script>
        async function loadCategories() {

            const categoriesContainer =
                document.getElementById("categories");

            const { data, error } = await supabaseClient
                .from("categories")
                .select("*")
                .eq("active", true)
                .order("sort_order", { ascending: true });

            if (error) {
                console.error("Erreur Supabase :", error);

                categoriesContainer.innerHTML =
                    "<p>Impossible de charger les catégories.</p>";

                return;
            }

            if (!data || data.length === 0) {
                categoriesContainer.innerHTML =
                    "<p>Aucune catégorie disponible pour le moment.</p>";

                return;
            }

            categoriesContainer.innerHTML = "";

            data.forEach(category => {

                const link = document.createElement("a");

                link.className = "category";

                link.href =
                    "categories/category.html?id=" + category.id;

                link.textContent = category.name;

                categoriesContainer.appendChild(link);
            });
        }

        loadCategories();
    </script>

</body>

</html>
